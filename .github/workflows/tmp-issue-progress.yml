name: tmp-issue-progress
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-issue-progress.yml'
permissions:
  issues: write
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function updateIssue(number, body, comment, close=false) {
              await github.rest.issues.update({ owner, repo, issue_number: number, body });
              if (comment) await github.rest.issues.createComment({ owner, repo, issue_number: number, body: comment });
              if (close) await github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed' });
            }

            const body39 = `<!-- plan-instrucciones-v1 -->
## Objetivo
Dar al repartidor sus rutas, entregas y reportes con datos reales.

## Qué hay que implementar
- [x] Conectar \`DeliveryRoutePage\` con \`frontend/src/api/deliveries.api.ts\`.
- [x] Mostrar el itinerario en orden de visita y registrar el resultado de cada parada.
- [x] Crear la vista de reportes de entrega por centro.
- [x] Optimizar la pantalla para móvil, que es donde se usará.

## Criterios de aceptación
- [ ] Un repartidor registra entregas desde una pantalla de 375 px de ancho.
- [x] No se puede registrar dos veces la misma entrega.

## Depende de
#17, #31

## Referencias
RF-13.

## Antes de cerrar
PR hacia \`develop\`, JSDoc en lo exportado, pruebas de la lógica nueva y sin handlers de MSW para lo ya conectado.`;

            const body40 = `<!-- plan-instrucciones-v1 -->
## Objetivo
Solicitar y resolver reprogramaciones con datos reales.

## Qué hay que implementar
- [x] Conectar \`ReschedulingsPage\` con \`frontend/src/api/reschedulings.api.ts\`.
- [x] Crear el formulario del repartidor con motivo y selector de coordinador del centro.
- [x] Crear la bandeja del coordinador, con la resolución y sus tres resultados.
- [x] Mostrar el historial de la solicitud.

## Criterios de aceptación
- [ ] El flujo solicitud y resolución funciona entre dos usuarios reales.

## Depende de
#18, #39

## Referencias
RF-14, RF-15.

## Antes de cerrar
PR hacia \`develop\`, JSDoc en lo exportado, pruebas de la lógica nueva y sin handlers de MSW para lo ya conectado.`;

            await updateIssue(39, body39, "Progreso automático: implementados endpoints reales de entregas (rutas asignadas, registro con prevención de duplicados, reportes por centro), conexión de UI/cliente y retiro de mocks de `deliveries`. Pendiente validación integrada en viewport 375px con entorno completo (AppHost/SQL Server).", false);
            await updateIssue(40, body40, "Progreso automático: implementados endpoints reales de reprogramaciones (crear/listar/resolver), formulario del repartidor con selector de ruta/pedido/coordinador, bandeja de resolución del coordinador (3 resultados) e historial básico en UI; retirados mocks de `reschedulings`. Pendiente verificación E2E del flujo entre dos usuarios reales en entorno integrado.", false);
