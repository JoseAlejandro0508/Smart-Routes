name: tmp-issue-frontend-backend
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-issue-frontend-backend.yml'
permissions:
  issues: write
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function setIssue(number, body, comment) {
              await github.rest.issues.update({ owner, repo, issue_number: number, body });
              if (comment) await github.rest.issues.createComment({ owner, repo, issue_number: number, body: comment });
            }

